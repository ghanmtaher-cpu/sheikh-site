<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة النشر</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#030b1c;--gold:#ba9853;--gold-soft:#dfc58d;--stroke:#dfc58d2e;--soft:#cddcee;--muted:#9aaac4;--text:#eef3fb;--sans:"IBM Plex Sans Arabic",system-ui,sans-serif;--display:"Amiri",serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--text);line-height:1.9;min-height:100vh;background:radial-gradient(60% 50% at 70% 0,#173a708c,#0000 70%),radial-gradient(40% 40% at 0 100%,#0b235499,#0000 70%),var(--bg);background-attachment:fixed}
a{color:inherit;text-decoration:none}
.page{width:min(860px,100% - 32px);margin:0 auto;padding:22px 0 70px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.logo{font-family:var(--display);font-size:1.7rem;color:var(--gold-soft);font-weight:700}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.links .btn{padding:7px 15px;font-size:14px;border-radius:12px}
h1{font-family:var(--display);font-size:clamp(28px,5vw,42px);line-height:1.5;color:var(--gold-soft);font-weight:700;margin-bottom:10px}
h2{font-family:var(--display);font-size:26px;color:var(--gold-soft);margin:34px 0 12px}
.card{border:1px solid var(--stroke);border-radius:22px;background:linear-gradient(160deg,#173a706b,#07173399);padding:22px;margin-bottom:14px}
a.card{display:block;transition:border-color .3s,transform .4s}a.card:hover{border-color:#dfc58d80;transform:translateY(-3px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border-radius:14px;border:1px solid var(--stroke);background:none;color:var(--gold-soft);font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:var(--bg);border-color:transparent}
.btn:disabled{opacity:.5}.btn.danger{color:#ffb4b4;border-color:#ffb4b455}
label{display:block;margin:14px 0 6px;font-weight:500;color:var(--soft)}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #8cc4e640;background:#061633;color:var(--text);font:inherit}
textarea{min-height:220px;resize:vertical}
input[type=checkbox]{width:auto;margin-inline-end:8px}
.chk{display:flex;align-items:center;margin-top:14px}
.note{color:var(--muted);font-size:14px}
.msg{margin-top:12px;color:var(--gold-soft)}.msg.err{color:#ffb4b4}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.date{color:var(--muted);font-size:13px}
.body{white-space:pre-wrap;font-size:18px;line-height:2.1;color:#dce5f2;margin:20px 0}
.grid{display:grid;gap:14px}
.thumb{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:linear-gradient(145deg,#1a3f86,#061333);margin-bottom:12px;display:grid;place-items:center;color:var(--gold-soft);font-size:44px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frame{aspect-ratio:16/9;width:100%;border:0;border-radius:16px;background:#000;margin:14px 0}
video.frame{height:auto}
audio{width:100%;margin-top:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:18px}
.tab{flex:none}.tab.on{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:var(--bg);border-color:transparent}
.hp{position:absolute;left:-9999px;opacity:0}
:focus-visible{outline:2px solid #8cc4e6;outline-offset:3px;border-radius:6px}
</style>
</head>
<body>
<div class="page">
<div class="top" style="margin-top:-6px"><span class="logo" style="font-size:1.4rem">لوحة النشر</span><a class="btn" href="index.html">الموقع</a></div>
<section id="login" class="card" hidden>
 <h1 style="font-size:28px">تسجيل الدخول</h1>
 <form id="lf"><label for="em">البريد الإلكتروني</label><input id="em" type="email" autocomplete="username" required>
 <label for="pw">كلمة المرور</label><input id="pw" type="password" autocomplete="current-password" required>
 <div class="row"><button class="btn btn-gold" type="submit">دخول</button></div><p id="lm" class="msg" role="status"></p></form>
</section>
<section id="panel" hidden>
 <div class="row" style="justify-content:space-between;margin:0 0 14px"><span class="note">مرحباً بك يا شيخ</span><button id="out" class="btn" type="button">خروج</button></div>
 <div class="tabs" id="tabs" role="tablist"></div>

 <div id="itemWrap">
  <form id="f" class="card">
   <h1 id="ft" style="font-size:28px;margin:0">جديد</h1>
   <label for="t">العنوان</label><input id="t" required maxlength="200">
   <label for="s" id="sl">ملخص</label><input id="s" maxlength="300">
   <div id="bw"><label for="b">نص المقال</label><textarea id="b"></textarea></div>
   <div id="lw"><label for="link" id="ll">رابط</label><input id="link" type="url" placeholder="https://" dir="ltr"></div>
   <label for="file" id="fl">ملف</label><input id="file" type="file">
   <p id="cp" class="note" hidden></p>
   <label class="chk" id="rmw" hidden><input id="rm" type="checkbox">حذف الملف الحالي</label>
   <label class="chk"><input id="pub" type="checkbox" checked>نشر الآن (وإلا يُحفظ مسودة)</label>
   <div class="row"><button id="sv" class="btn btn-gold" type="submit">حفظ</button><button id="cn" class="btn" type="button" hidden>إلغاء التعديل</button></div>
   <p id="fm" class="msg" role="status"></p>
  </form>
  <h2 id="lt">القائمة</h2><div id="list"></div>
 </div>

 <div id="bioWrap" hidden>
  <form id="bf" class="card"><h1 style="font-size:28px;margin:0">السيرة الذاتية</h1>
   <label for="bt">العنوان</label><input id="bt" maxlength="200" value="السيرة الذاتية">
   <label for="bb">النص</label><textarea id="bb" style="min-height:320px"></textarea>
   <div class="row"><button class="btn btn-gold" type="submit">حفظ السيرة</button></div><p id="bm" class="msg" role="status"></p></form>
 </div>

 <div id="msgWrap" hidden><h2 style="margin-top:0">الرسائل الواردة</h2><div id="mlist"></div></div>
</section>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
if(typeof SITE==='undefined'||typeof supabase==='undefined'||/YOUR-/.test(SITE.url+SITE.key)){
 document.body.innerHTML='<div style="padding:28px;max-width:560px;margin:auto;font:17px/2 sans-serif;color:#ffb4b4">لم يُضبط الإعداد بعد. ضع رابط مشروع Supabase والمفتاح في ملف config.js، ثم ارفع جميع الملفات معاً في مكان واحد.</div>';
 throw new Error('Site is not configured');
}
const sb=supabase.createClient(SITE.url,SITE.key),$=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const fmt=s=>new Date(s).toLocaleDateString('ar',{year:'numeric',month:'long',day:'numeric'});
const ytid=u=>{const m=(u||'').match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);return m?m[1]:null};
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:null;
const TABS=[['article','المقالات'],['recitation','التلاوات'],['video','المقاطع'],['bio','السيرة'],['messages','الرسائل']];
const CFG={
 article:{one:'مقال',sl:'ملخص قصير (يظهر في البطاقة)',body:1,link:0,fl:'ملف PDF للتنزيل (اختياري)',acc:'application/pdf,.pdf'},
 recitation:{one:'تلاوة',sl:'وصف (اختياري)',body:0,link:1,ll:'أو رابط صوت خارجي (للملفات الكبيرة)',fl:'ملف صوتي MP3 (حتى 50 ميجابايت)',acc:'audio/*'},
 video:{one:'مقطع',sl:'وصف (اختياري)',body:0,link:1,ll:'رابط يوتيوب (الأفضل)',fl:'أو ارفع فيديو قصير (حتى 50 ميجابايت)',acc:'video/*'}};
let tab='article',cur=null;
const say=(e,t,err)=>{e.textContent=t;e.classList.toggle('err',!!err)};
const show=on=>{$('#login').hidden=on;$('#panel').hidden=!on};
const pathOf=u=>{const i=(u||'').indexOf('/object/public/files/');return i<0?null:decodeURIComponent(u.slice(i+21))};
const rmFile=async u=>{const p=pathOf(u);if(p)await sb.storage.from('files').remove([p])};
async function up(file,kind){
 if(file.size>50*1024*1024)throw new Error('الملف أكبر من 50 ميجابايت؛ استخدم رابطاً خارجياً بدلاً منه.');
 const ext=((file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5))||'bin';
 const path=kind+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
 const r=await sb.storage.from('files').upload(path,file,{contentType:file.type||undefined});
 if(r.error)throw r.error;
 return sb.storage.from('files').getPublicUrl(path).data.publicUrl}

(async()=>{const{data:{session}}=await sb.auth.getSession();show(!!session);if(session){drawTabs();go('article')}})();
$('#lf').onsubmit=async e=>{e.preventDefault();
 const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
 if(error)return say($('#lm'),'تعذر الدخول: تأكد من البريد وكلمة المرور.',1);
 say($('#lm'),'');show(true);drawTabs();go('article')};
$('#out').onclick=async()=>{await sb.auth.signOut();show(false)};

function drawTabs(){const t=$('#tabs');t.replaceChildren();
 TABS.forEach(([k,n])=>{const b=el('button','btn tab'+(k===tab?' on':''),n);b.type='button';b.onclick=()=>go(k);t.append(b)})}
function go(k){tab=k;drawTabs();
 $('#itemWrap').hidden=!CFG[k];$('#bioWrap').hidden=k!=='bio';$('#msgWrap').hidden=k!=='messages';
 if(CFG[k]){reset();loadItems()}else if(k==='bio')loadBio();else loadMsgs()}

function reset(){cur=null;const c=CFG[tab];$('#f').reset();$('#pub').checked=true;
 $('#ft').textContent=c.one+' جديد';$('#lt').textContent='قائمة: '+c.one;$('#sl').textContent=c.sl;
 $('#bw').hidden=!c.body;$('#lw').hidden=!c.link;if(c.ll)$('#ll').textContent=c.ll;
 $('#fl').textContent=c.fl;$('#file').accept=c.acc;
 $('#cn').hidden=true;$('#cp').hidden=true;$('#rmw').hidden=true;say($('#fm'),'')}
$('#cn').onclick=reset;
function edit(a){cur=a;$('#t').value=a.title;$('#s').value=a.summary||'';$('#b').value=a.body||'';$('#link').value=a.link_url||'';$('#pub').checked=a.published;
 $('#ft').textContent='تعديل '+CFG[tab].one;$('#cn').hidden=false;$('#rm').checked=false;
 $('#cp').hidden=$('#rmw').hidden=!a.file_url;if(a.file_url)$('#cp').textContent='يوجد ملف مرفوع. اختر ملفاً جديداً لاستبداله.';
 scrollTo({top:0,behavior:'smooth'})}

$('#f').onsubmit=async e=>{e.preventDefault();
 const btn=$('#sv');btn.disabled=true;say($('#fm'),'جارٍ الحفظ…');
 try{
  const old=cur?cur.file_url:null;let file_url=old;const file=$('#file').files[0];
  if(file)file_url=await up(file,tab);else if($('#rm').checked)file_url=null;
  const link_url=CFG[tab].link?($('#link').value.trim()||null):null;
  if(link_url&&!/^https?:\/\//i.test(link_url))throw new Error('الرابط يجب أن يبدأ بـ https://');
  if(tab!=='article'&&!file_url&&!link_url)throw new Error('أضف ملفاً أو رابطاً.');
  const row={kind:tab,title:$('#t').value.trim(),summary:$('#s').value.trim()||null,body:CFG[tab].body?$('#b').value:null,file_url,link_url,published:$('#pub').checked};
  const r=cur?await sb.from('items').update(row).eq('id',cur.id):await sb.from('items').insert(row);
  if(r.error)throw r.error;
  if(old&&old!==file_url)await rmFile(old);
  const msg=row.published?'تم الحفظ والنشر ✓':'تم حفظ المسودة ✓';reset();say($('#fm'),msg);loadItems();
 }catch(err){say($('#fm'),'تعذر الحفظ: '+(err.message||err),1)}finally{btn.disabled=false}};

const mk=(t,fn,cls)=>{const b=el('button','btn '+(cls||''),t);b.type='button';b.onclick=fn;return b};
async function loadItems(){
 const k=tab,{data,error}=await sb.from('items').select('*').eq('kind',k).order('created_at',{ascending:false});
 if(k!==tab)return;const box=$('#list');box.replaceChildren();
 if(error)return box.append(el('p','msg err','تعذر التحميل: '+error.message));
 if(!data.length)return box.append(el('p','note','لا شيء هنا بعد.'));
 data.forEach(a=>{
  const c=el('div','card'),d=el('div','date',fmt(a.created_at)+' · '+(a.published?'منشور':'مسودة')+(a.file_url?' · ملف':'')+(a.link_url?' · رابط':''));
  const r=el('div','row');
  r.append(mk('تعديل',()=>edit(a)),
   mk(a.published?'إخفاء':'نشر',async()=>{const x=await sb.from('items').update({published:!a.published}).eq('id',a.id);if(x.error)alert(x.error.message);loadItems()}),
   mk('حذف',async()=>{if(!confirm('حذف نهائياً؟'))return;const x=await sb.from('items').delete().eq('id',a.id);if(x.error)return alert(x.error.message);if(a.file_url)await rmFile(a.file_url);loadItems()},'danger'));
  c.append(el('b','',a.title),d,r);box.append(c)})}

async function loadBio(){
 const{data}=await sb.from('pages').select('*').eq('key','bio').maybeSingle();
 $('#bt').value=(data&&data.title)||'السيرة الذاتية';$('#bb').value=(data&&data.body)||'';say($('#bm'),'')}
$('#bf').onsubmit=async e=>{e.preventDefault();
 const r=await sb.from('pages').upsert({key:'bio',title:$('#bt').value.trim()||'السيرة الذاتية',body:$('#bb').value});
 say($('#bm'),r.error?'تعذر الحفظ: '+r.error.message:'تم حفظ السيرة ✓',!!r.error)};

async function loadMsgs(){
 const{data,error}=await sb.from('messages').select('*').order('created_at',{ascending:false});
 const box=$('#mlist');box.replaceChildren();
 if(error)return box.append(el('p','msg err','تعذر التحميل: '+error.message));
 if(!data.length)return box.append(el('p','note','لا رسائل بعد.'));
 data.forEach(m=>{const c=el('div','card');
  c.append(el('b','',m.name),el('div','date',fmt(m.created_at)+(m.email?' · '+m.email:'')),el('div','body',m.message));
  const r=el('div','row');r.append(mk('حذف',async()=>{if(!confirm('حذف الرسالة؟'))return;const x=await sb.from('messages').delete().eq('id',m.id);if(x.error)alert(x.error.message);loadMsgs()},'danger'));
  c.append(r);box.append(c)})}

</script>
</body>
</html>
